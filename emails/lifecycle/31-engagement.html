<!--
  Email 31 — Engagement (single event: like / reply / reaction)
  Tokens: {{eyebrow}} {{headline}} {{actor_name}} {{actor_initial}} {{verb}} {{snippet}} {{cta_url}} {{PAUSE_URL}} {{UNSUB_URL}}
  Subject: {{actor_name}} {{verb}}
-->
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="x-apple-disable-message-reformatting"><meta name="color-scheme" content="dark"><meta name="supported-color-schemes" content="dark">
  <title>New activity on YourScore</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>body,table,td{margin:0;padding:0}img{border:0;outline:none;text-decoration:none;display:block}table{border-collapse:collapse}a{text-decoration:none}
    @media (max-width:600px){.container{width:100%!important}.px{padding-left:24px!important;padding-right:24px!important}.headline{font-size:44px!important;line-height:46px!important}}</style>
</head>
<body style="margin:0;padding:0;background:#0a0a0f;font-family:'DM Sans',Helvetica,Arial,sans-serif;color:#ffffff;">
  <div style="display:none;max-height:0;overflow:hidden;font-size:1px;line-height:1px;color:#0a0a0f;">People are reacting to what you post. Jump back in.</div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#0a0a0f;background-image:linear-gradient(180deg,#0a0a0f 0%,#08130f 100%);"><tr><td align="center" style="padding:40px 16px;">
    <table role="presentation" class="container" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px;max-width:600px;">

      <tr><td align="center" class="px" style="padding:0 40px 34px;">
        <a href="https://yourscore.app"><img src="https://yourscore.app/logo.png" alt="YourScore" width="148" height="44" style="width:148px;height:44px;display:block;"></a>
      </td></tr>

      <tr><td class="px" align="left" style="padding:0 40px 12px;">
        <p style="margin:0;font-family:'DM Sans',Helvetica,Arial,sans-serif;font-size:12px;letter-spacing:3px;color:#2dd4bf;font-weight:700;text-transform:uppercase;">{{eyebrow}}</p>
      </td></tr>

      <tr><td class="px" style="padding:0 40px 14px;">
        <h1 class="headline" style="margin:0;font-family:'Bebas Neue',Impact,Arial,sans-serif;font-size:56px;line-height:54px;color:#ffffff;font-weight:400;">{{headline}}</h1>
      </td></tr>

      <!-- Actor identity -->
      <tr><td align="center" style="padding:8px 40px 22px;">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr>
          <td width="64" height="64" align="center" valign="middle" bgcolor="#0d2420" style="background:radial-gradient(circle at 50% 40%,rgba(45,212,191,0.32),rgba(20,120,110,0.10));border:1.5px solid rgba(45,212,191,0.45);border-radius:50%;font-family:'Bebas Neue',Impact,sans-serif;font-size:28px;color:#7fecdd;line-height:62px;box-shadow:0 0 30px rgba(45,212,191,0.3);">{{actor_initial}}</td>
        </tr></table>
        <div style="font-family:'DM Sans',Helvetica,Arial,sans-serif;font-size:16px;color:#ffffff;line-height:1.4;margin-top:14px;"><strong style="color:#ffffff;">{{actor_name}}</strong> {{verb}}</div>
      </td></tr>

      <!-- The thing they reacted to -->
      <tr><td class="px" align="center" style="padding:0 40px 28px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr>
          <td style="background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:16px 20px;">
            <p style="margin:0;font-family:'DM Sans',Helvetica,Arial,sans-serif;font-size:15px;line-height:22px;color:#c9d3ce;">&ldquo;{{snippet}}&rdquo;</p>
          </td>
        </tr></table>
      </td></tr>

      <tr><td class="px" align="center" style="padding:2px 40px 10px;">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr><td bgcolor="#2dd4bf" style="background:linear-gradient(135deg,#2dd4bf 0%,#12a594 100%);border-radius:12px;box-shadow:0 0 32px rgba(45,212,191,0.38);">
          <a href="{{cta_url}}" style="display:inline-block;color:#03211d;font-family:'DM Sans',Helvetica,Arial,sans-serif;font-size:15px;font-weight:700;letter-spacing:0.3px;padding:18px 44px;border-radius:12px;">Jump back in &nbsp;&rarr;</a>
        </td></tr></table>
      </td></tr>

      <tr><td class="px" style="padding:40px 40px 24px;">
        <table width="100%" cellpadding="0" cellspacing="0" border="0"><tr><td style="border-top:1px solid rgba(255,255,255,0.06);padding-top:24px;">
          <p style="margin:0 0 10px;font-family:'DM Sans',Helvetica,Arial,sans-serif;font-size:12px;line-height:18px;color:#6b6b85;"><a href="{{PAUSE_URL}}" style="color:#8888aa;text-decoration:underline;">Pause emails</a> &nbsp;&middot;&nbsp; <a href="{{UNSUB_URL}}" style="color:#8888aa;text-decoration:underline;">Unsubscribe</a> &nbsp;&middot;&nbsp; <a href="https://yourscore.app/support" style="color:#8888aa;text-decoration:underline;">Support</a></p>
          <p style="margin:0;font-family:'DM Sans',Helvetica,Arial,sans-serif;font-size:11px;letter-spacing:1.5px;color:#6b6b85;text-transform:uppercase;font-weight:600;">YourScore &nbsp;&middot;&nbsp; Your football knowledge. Ranked.</p>
        </td></tr></table>
      </td></tr>
    </table>
  </td></tr></table>
</body></html>
